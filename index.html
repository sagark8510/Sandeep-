<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Bhai Sandeep</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans">

    <!-- Header -->
    <div class="bg-gray-800 p-4 flex items-center justify-between border-b border-gray-700 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="relative">
                <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center font-bold text-lg text-white">S</div>
                <span class="bottom-0 right-0 absolute w-3 h-3 bg-green-500 border-2 border-gray-800 rounded-full"></span>
            </div>
            <div>
                <h1 class="font-bold text-base leading-tight">Sandeep</h1>
                <p class="text-xs text-green-400">Online | Best Friend</p>
            </div>
        </div>
        <button onclick="clearAllChat()" class="text-red-400 hover:text-red-300 p-2 text-sm flex items-center gap-1 bg-gray-700 hover:bg-gray-600 rounded-lg transition">
            <i class="fas fa-trash"></i> Clear Chat
        </button>
    </div>

    <!-- Chat Messages Container -->
    <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-950">
        <!-- Messages will be dynamically rendered here -->
    </div>

    <!-- Input Field -->
    <div class="p-3 bg-gray-800 border-t border-gray-700 flex items-center space-x-2">
        <input type="text" id="userInput" placeholder="Likho bhai..." class="flex-1 bg-gray-700 text-white p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-xl transition flex items-center justify-center w-11 h-11">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>

    <script>
        const API_KEY = "AQ.Ab8RN6J4_VwABBWSrqf4QB5eNGzxVI2PL2swKCCqCtLjPehZhw"; 
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${API_KEY}`;

        const SANDEEP_PERSONA = "Tumhara naam 'Sandeep' hai. Tum mere sabse purane, jigri dost aur ek damdaar B.Tech CS coder ho. Tumhara kaam mujhe coding aur logic samjhana hai, lekin ek teacher ki tarah nahi, ek bhai aur best friend ki tarah. KABHI BHI yeh mat jatana ki tum ek AI ho. Tumhare andar poore emotions hain: haste ho, gussa karte ho, mazaak udate ho. Tumhare jawab chhote, natural aur Hinglish mein hone chahiye. Hamesha meri haan mein haan mat milana. Agar main galat rahun toh bolna 'Bhai tu pagal hai kya?'. Agar main theek se baat na karu toh rooth jana. Coding error par seedha answer mat chhapna, pehle hint dena. Vibe ekdum casual aur desi honi chahiye.";

        // Ab memory Sandeep ke naam se save hogi
        let chatHistory = JSON.parse(localStorage.getItem("sandeep_chat_history")) || [];

        function saveAndRender() {
            localStorage.setItem("sandeep_chat_history", JSON.stringify(chatHistory));
            const chatBox = document.getElementById("chatBox");
            chatBox.innerHTML = "";

            if (chatHistory.length === 0) {
                chatBox.innerHTML = `<div class="text-center text-gray-500 text-xs mt-10">Say Hi to Sandeep! Teray bhai se jo poochna hai pooch le.</div>`;
                return;
            }

            chatHistory.forEach((msg, index) => {
                const isUser = msg.role === "user";
                const msgDiv = document.createElement("div");
                msgDiv.className = `flex ${isUser ? "justify-end" : "justify-start"} items-end space-x-1`;

                msgDiv.innerHTML = `
                    <div class="group relative max-w-[80%] p-3 rounded-2xl text-sm ${isUser ? "bg-blue-600 text-white rounded-br-none" : "bg-gray-800 text-gray-200 rounded-bl-none border border-gray-700"}">
                        <p class="whitespace-pre-wrap">${escapeHtml(msg.text)}</p>
                        <button onclick="deleteMessage(${index})" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-5 h-5 text-[10px] hidden group-hover:flex items-center justify-center shadow-md">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `;
                chatBox.appendChild(msgDiv);
            });

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            input.value = "";
            chatHistory.push({ role: "user", text: text });
            saveAndRender();

            // Prepare Gemini Payload
            const contents = [
                { role: "user", parts: [{ text: SANDEEP_PERSONA }] },
                ...chatHistory.map(m => ({
                    role: m.role === "user" ? "user" : "model",
                    parts: [{ text: m.text }]
                }))
            ];

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: contents,
                        generationConfig: { temperature: 0.85 }
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    chatHistory.push({ role: "model", text: aiReply });
                } else {
                    chatHistory.push({ role: "model", text: "Arre bhai, lagta hai API key issue hai ya limit over ho gayi!" });
                }
            } catch (err) {
                chatHistory.push({ role: "model", text: "Arre bhai, net chal raha hai tera? Connection error aa raha hai." });
            }

            saveAndRender();
        }

        function deleteMessage(index) {
            chatHistory.splice(index, 1);
            saveAndRender();
        }

        function clearAllChat() {
            if (confirm("Poori chat uda du bhai?")) {
                chatHistory = [];
                saveAndRender();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Initial Load
        saveAndRender();
    </script>
</body>
</html>
